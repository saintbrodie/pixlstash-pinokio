name: Windows installer
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Launcher and setup tests
        run: |
          node --test tests/launcher.test.js
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Bootstrap and install CPU backend
        run: |
          python -m pip install uv==0.13.8
          node scripts/run.js install --backend cpu
      - name: Serve WebUI and stop
        run: env/Scripts/python.exe -s -u tests/smoke.py
